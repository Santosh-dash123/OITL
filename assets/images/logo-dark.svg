<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <!-- Background Shadow Filter -->
    <filter id="glow-shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="odisha-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="35%" stop-color="#FF9800"/>
      <stop offset="70%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <linearGradient id="it-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="85%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="map-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="hand-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Right Graphic: Odisha State Map & Victory Hand Sign -->
    <g id="odisha-map-group" transform="translate(340, 5)">
      <!-- Odisha Map Silhouette -->
      <path d="M 55,20 
               C 70,15 85,25 100,20 
               C 115,18 128,30 135,42 
               C 142,55 140,70 148,82 
               C 152,95 146,110 138,120 
               C 128,132 118,135 110,148 
               C 105,155 90,165 78,162 
               C 68,160 62,150 52,152 
               C 42,154 35,165 25,160 
               C 18,155 20,140 15,130 
               C 10,120 2,112 5,100 
               C 8,88 20,82 22,70 
               C 24,58 35,50 40,38 
               Z" 
            fill="url(#map-grad-dark)" 
            stroke="#022C22" 
            stroke-width="5" 
            stroke-linejoin="round"
            filter="url(#glow-shadow-dark)" />

      <!-- Map Internal District / Tech Circuit Lines -->
      <path d="M 45,45 Q 65,55 85,42 T 120,60" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 30,75 Q 60,85 80,72 T 130,95" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 25,105 Q 55,115 85,108 T 115,135" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 40,135 Q 65,140 85,130" fill="none" stroke="#064E3B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="88" cy="85" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Victory Hand Sign (Peace / Victory V-sign) -->
      <g id="victory-hand" transform="translate(5, 5)">
        <!-- Back Stroke -->
        <path d="M 35,95 
                 C 25,90 20,75 25,60 
                 C 28,52 35,48 40,55 
                 C 42,40 45,15 52,10 
                 C 58,5 66,10 65,22 
                 L 64,48 
                 C 68,35 74,18 82,15 
                 C 89,12 96,18 94,30 
                 L 90,65 
                 C 94,62 102,64 104,72 
                 C 106,80 100,88 95,95 
                 C 88,105 75,115 55,112 
                 C 42,110 38,102 35,95 Z" 
              fill="#090D16" 
              transform="scale(1.06) translate(-3, -2)"/>

        <!-- Hand Fill with Gradient -->
        <path d="M 35,95 
                 C 25,90 20,75 25,60 
                 C 28,52 35,48 40,55 
                 C 42,40 45,15 52,10 
                 C 58,5 66,10 65,22 
                 L 64,48 
                 C 68,35 74,18 82,15 
                 C 89,12 96,18 94,30 
                 L 90,65 
                 C 94,62 102,64 104,72 
                 C 106,80 100,88 95,95 
                 C 88,105 75,115 55,112 
                 C 42,110 38,102 35,95 Z" 
              fill="url(#hand-grad-dark)" 
              stroke="#090D16" 
              stroke-width="4.5" 
              stroke-linejoin="round"/>

        <!-- Fingers Lines -->
        <path d="M 64,48 L 65,65" stroke="#090D16" stroke-width="4" stroke-linecap="round"/>
        <path d="M 68,68 C 74,66 82,70 82,78 C 82,85 75,88 68,85" fill="#FACC15" stroke="#090D16" stroke-width="3.5"/>
        <path d="M 70,82 C 78,80 88,84 88,92 C 88,98 80,102 72,98" fill="#EAB308" stroke="#090D16" stroke-width="3.5"/>
        <path d="M 35,62 C 45,62 55,70 55,80 C 55,88 45,92 38,88" fill="#FEF08A" stroke="#090D16" stroke-width="4"/>
      </g>
    </g>

    <!-- Typography -->
    <g id="typography" transform="translate(0, 15)">
      <!-- ODISHA Shadow -->
      <text x="5" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="68" 
            font-weight="900" 
            font-style="italic" 
            fill="#050811" 
            stroke="#050811" 
            stroke-width="14" 
            stroke-linejoin="round"
            letter-spacing="-1">Odisha</text>
      
      <!-- ODISHA Text -->
      <text x="5" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="68" 
            font-weight="900" 
            font-style="italic" 
            fill="url(#odisha-grad-dark)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linejoin="round"
            letter-spacing="-1">Odisha</text>

      <!-- IT Shadow -->
      <text x="245" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="72" 
            font-weight="900" 
            fill="#050811" 
            stroke="#050811" 
            stroke-width="14" 
            stroke-linejoin="round">IT</text>

      <!-- IT Text -->
      <text x="245" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="72" 
            font-weight="900" 
            fill="url(#it-grad-dark)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linejoin="round">IT</text>

      <!-- Dash -->
      <rect x="10" y="125" width="28" height="10" rx="5" fill="#38BDF8" stroke="#050811" stroke-width="4"/>
      <rect x="12" y="127" width="24" height="6" rx="3" fill="#7DD3FC"/>

      <!-- LEARNERS Shadow -->
      <text x="48" y="148" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="60" 
            font-weight="900" 
            font-style="italic" 
            fill="#050811" 
            stroke="#050811" 
            stroke-width="14" 
            stroke-linejoin="round">Learners</text>

      <!-- LEARNERS Text -->
      <text x="48" y="148" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="60" 
            font-weight="900" 
            font-style="italic" 
            fill="#FFFFFF" 
            stroke="#38BDF8" 
            stroke-width="1.8">Learners</text>
            
      <!-- Tagline -->
      <g transform="translate(15, 175)">
        <rect x="0" y="-14" width="310" height="22" rx="11" fill="#FFFFFF" opacity="0.1"/>
        <text x="8" y="2" 
              font-family="'Poppins', 'Segoe UI', sans-serif" 
              font-size="12.5" 
              font-weight="700" 
              fill="#E2E8F0" 
              letter-spacing="2.5">EMPOWERING ODIA YOUTH IN TECH</text>
      </g>
    </g>
  </g>
</svg>
