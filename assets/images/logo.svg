<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <!-- Background Shadow Filter -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>

    <!-- Gradients -->
    <!-- Odisha Orange Gradient -->
    <linearGradient id="odisha-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="35%" stop-color="#FF8A00"/>
      <stop offset="70%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- IT Green Gradient -->
    <linearGradient id="it-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="85%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Odisha Map Gradient -->
    <linearGradient id="map-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Hand Gradient -->
    <linearGradient id="hand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Learners Blue Stroke -->
    <linearGradient id="learners-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Right Graphic: Odisha State Map & Victory Hand Sign -->
    <g id="odisha-map-group" transform="translate(340, 5)">
      <!-- Odisha Map Silhouette with stylized geographic contours -->
      <path d="M 55,20 
               C 70,15 85,25 100,20 
               C 115,18 128,30 135,42 
               C 142,55 140,70 148,82 
               C 152,95 146,110 138,120 
               C 128,132 118,135 110,148 
               C 105,155 90,165 78,162 
               C 68,160 62,150 52,152 
               C 42,154 35,165 25,160 
               C 18,155 20,140 15,130 
               C 10,120 2,112 5,100 
               C 8,88 20,82 22,70 
               C 24,58 35,50 40,38 
               Z" 
            fill="url(#map-grad)" 
            stroke="#0B3B17" 
            stroke-width="5" 
            stroke-linejoin="round"
            filter="url(#glow-shadow)" />

      <!-- Map Internal District / Topography / Tech Circuit Lines -->
      <path d="M 45,45 Q 65,55 85,42 T 120,60" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 30,75 Q 60,85 80,72 T 130,95" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 25,105 Q 55,115 85,108 T 115,135" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 40,135 Q 65,140 85,130" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="88" cy="85" r="3.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Smart Hub / Bhubaneswar Indicator -->

      <!-- Victory Hand Sign (Peace / Victory V-sign) -->
      <g id="victory-hand" transform="translate(5, 5)">
        <!-- Back Drop shadow outline -->
        <path d="M 35,95 
                 C 25,90 20,75 25,60 
                 C 28,52 35,48 40,55 
                 C 42,40 45,15 52,10 
                 C 58,5 66,10 65,22 
                 L 64,48 
                 C 68,35 74,18 82,15 
                 C 89,12 96,18 94,30 
                 L 90,65 
                 C 94,62 102,64 104,72 
                 C 106,80 100,88 95,95 
                 C 88,105 75,115 55,112 
                 C 42,110 38,102 35,95 Z" 
              fill="#0F172A" 
              transform="scale(1.06) translate(-3, -2)"/>

        <!-- Hand Fill with Gradient -->
        <path d="M 35,95 
                 C 25,90 20,75 25,60 
                 C 28,52 35,48 40,55 
                 C 42,40 45,15 52,10 
                 C 58,5 66,10 65,22 
                 L 64,48 
                 C 68,35 74,18 82,15 
                 C 89,12 96,18 94,30 
                 L 90,65 
                 C 94,62 102,64 104,72 
                 C 106,80 100,88 95,95 
                 C 88,105 75,115 55,112 
                 C 42,110 38,102 35,95 Z" 
              fill="url(#hand-grad)" 
              stroke="#000000" 
              stroke-width="4.5" 
              stroke-linejoin="round"/>

        <!-- Fingers & Knuckle Crease Lines -->
        <!-- Index & Middle finger separation -->
        <path d="M 64,48 L 65,65" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
        <!-- Ring finger folded -->
        <path d="M 68,68 C 74,66 82,70 82,78 C 82,85 75,88 68,85" fill="#FACC15" stroke="#000000" stroke-width="3.5"/>
        <!-- Pinky finger folded -->
        <path d="M 70,82 C 78,80 88,84 88,92 C 88,98 80,102 72,98" fill="#EAB308" stroke="#000000" stroke-width="3.5"/>
        <!-- Thumb folded over knuckles -->
        <path d="M 35,62 C 45,62 55,70 55,80 C 55,88 45,92 38,88" fill="#FDE047" stroke="#000000" stroke-width="4"/>
      </g>
    </g>

    <!-- Left / Center Graphic: Stylized Typography "Odisha IT – Learners" -->
    <g id="typography" transform="translate(0, 15)">
      <!-- Row 1: "Odisha" + "IT" -->
      <!-- ODISHA Background Outline / 3D Shadow -->
      <text x="5" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="68" 
            font-weight="900" 
            font-style="italic" 
            fill="#0F172A" 
            stroke="#0F172A" 
            stroke-width="14" 
            stroke-linejoin="round"
            letter-spacing="-1">Odisha</text>
      
      <!-- ODISHA Main Vibrant Gradient Text -->
      <text x="5" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="68" 
            font-weight="900" 
            font-style="italic" 
            fill="url(#odisha-grad)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linejoin="round"
            letter-spacing="-1">Odisha</text>

      <!-- IT Background 3D Outline -->
      <text x="245" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="72" 
            font-weight="900" 
            fill="#0F172A" 
            stroke="#0F172A" 
            stroke-width="14" 
            stroke-linejoin="round"
            letter-spacing="0">IT</text>

      <!-- IT Main Vibrant Green Gradient Text -->
      <text x="245" y="78" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="72" 
            font-weight="900" 
            fill="url(#it-grad)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linejoin="round"
            letter-spacing="0">IT</text>

      <!-- Row 2: "– Learners" -->
      <!-- Sub-Bar / Dash Symbol -->
      <rect x="10" y="125" width="28" height="10" rx="5" fill="#0284C7" stroke="#0F172A" stroke-width="4"/>
      <rect x="12" y="127" width="24" height="6" rx="3" fill="#38BDF8"/>

      <!-- LEARNERS Background 3D Navy Shadow -->
      <text x="48" y="148" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="60" 
            font-weight="900" 
            font-style="italic" 
            fill="#0F172A" 
            stroke="#0F172A" 
            stroke-width="14" 
            stroke-linejoin="round"
            letter-spacing="-0.5">Learners</text>

      <!-- LEARNERS Pure Crisp White Text with subtle bevel effect -->
      <text x="48" y="148" 
            font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" 
            font-size="60" 
            font-weight="900" 
            font-style="italic" 
            fill="#FFFFFF" 
            stroke="#38BDF8" 
            stroke-width="1.8" 
            letter-spacing="-0.5">Learners</text>
            
      <!-- Institute Tagline Underneath -->
      <g transform="translate(15, 175)">
        <rect x="0" y="-14" width="310" height="22" rx="11" fill="#0F172A" opacity="0.12"/>
        <text x="8" y="2" 
              font-family="'Poppins', 'Segoe UI', sans-serif" 
              font-size="12.5" 
              font-weight="700" 
              fill="#0F172A" 
              letter-spacing="2.5">EMPOWERING ODIA YOUTH IN TECH</text>
      </g>
    </g>
  </g>
</svg>
